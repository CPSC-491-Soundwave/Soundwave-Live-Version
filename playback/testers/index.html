<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soundwave Playback Test</title>
</head>
<body>
  <h1>Soundwave Playback Test</h1>

  <button id="play">Play</button>
  <button id="pause">Pause</button>

  <label>
    Volume
    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.1"
      value="0.5"
    >
  </label>

  <label>
    Seek to second
    <input id="seek" type="number" min="0" value="0">
  </label>

  <button id="seekButton">Seek</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="playback.js"></script>
</body>
</html>
