name: Soundwave CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        if: ${{ hashFiles('server/package-lock.json') != '' }}
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client lint
        working-directory: client
        run: npm run lint

  client-build:
    name: Client Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

  auth-security:
    name: Authentication Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run authentication security tests
        working-directory: server
        run: npm run test:auth

      - name: Verify missing JWT secret is rejected
        working-directory: server
        run: |
          if env -u JWT_SECRET node src/server.js > /tmp/missing-jwt.log 2>&1; then
            echo "Server unexpectedly started without JWT_SECRET."
            exit 1
          fi

          echo "Server correctly rejected missing JWT_SECRET."

      - name: Verify server starts with CI-only JWT secret
        working-directory: server
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT_SECRET"

          PORT=0 JWT_SECRET="$JWT_SECRET" \
            node src/server.js > /tmp/auth-startup.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          STARTED=false

          for attempt in {1..20}; do
            if grep -q "Soundwave API listening" /tmp/auth-startup.log; then
              STARTED=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before successful startup."
              cat /tmp/auth-startup.log
              exit 1
            fi

            sleep 0.25
          done

          if [ "$STARTED" != "true" ]; then
            echo "Server did not report successful startup."
            cat /tmp/auth-startup.log
            exit 1
          fi

          echo "Server started successfully with a generated CI-only JWT secret."

  client-test:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test:run

  database-test:
    name: Database Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soundwave_app
          POSTGRES_PASSWORD: soundwave_ci_only_password
          POSTGRES_DB: soundwave_allison_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundwave_app -d soundwave_allison_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: database/package-lock.json

      - name: Install database dependencies
        working-directory: database
        run: npm ci

      - name: Create CI test database environment
        working-directory: database
        run: |
          cat > .env.test <<'ENVEOF'
          PGHOST=127.0.0.1
          PGPORT=5432
          PGUSER=soundwave_app
          PGPASSWORD=soundwave_ci_only_password
          PGDATABASE=soundwave_allison_test
          ENVEOF

      - name: Run database migrations
        working-directory: database
        run: npm run db:migrate:test

      - name: Verify database migration rerun is safe
        working-directory: database
        run: npm run db:migrate:test

      - name: Seed database test fixtures
        working-directory: database
        run: npm run db:seed:test

      - name: Run database integration tests
        working-directory: database
        run: npm run test:db

  build-metadata:
    name: Build Metadata
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build_info.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate build metadata
        id: build_info
        run: |
          node scripts/generate-build-info.mjs \
            artifacts/build-info.json

          BUILD_VERSION="$(
            node -p "JSON.parse(require('fs').readFileSync('artifacts/build-info.json', 'utf8')).version"
          )"

          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "SOUNDWAVE_BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Verify build metadata exports
        run: |
          test -n "$SOUNDWAVE_BUILD_VERSION"
          test "$SOUNDWAVE_BUILD_VERSION" = "${{ steps.build_info.outputs.version }}"
          echo "Build version export verified: $SOUNDWAVE_BUILD_VERSION"

      - name: Display build metadata
        run: cat artifacts/build-info.json

      - name: Upload build metadata
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-build-info-${{ github.run_number }}
          path: artifacts/build-info.json
          if-no-files-found: error
          retention-days: 30

  docker-packaging:
    name: Docker Packaging
    runs-on: ubuntu-latest
    needs:
      - build-metadata

    env:
      SOUNDWAVE_BUILD_VERSION: ${{ needs.build-metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify shared build identifier
        run: |
          test -n "$SOUNDWAVE_BUILD_VERSION"
          echo "Using Soundwave build version: $SOUNDWAVE_BUILD_VERSION"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build server Docker image
        run: |
          docker build \
            --build-arg SOUNDWAVE_BUILD_VERSION="$SOUNDWAVE_BUILD_VERSION" \
            --tag "soundwave-server:$SOUNDWAVE_BUILD_VERSION" \
            ./server

      - name: Build client Docker image
        run: |
          docker build \
            --build-arg SOUNDWAVE_BUILD_VERSION="$SOUNDWAVE_BUILD_VERSION" \
            --tag "soundwave-client:$SOUNDWAVE_BUILD_VERSION" \
            ./client

      - name: Verify server image metadata
        run: |
          ACTUAL_VERSION="$(
            docker image inspect \
              "soundwave-server:$SOUNDWAVE_BUILD_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
          )"

          test "$ACTUAL_VERSION" = "$SOUNDWAVE_BUILD_VERSION"

      - name: Verify client image metadata
        run: |
          ACTUAL_VERSION="$(
            docker image inspect \
              "soundwave-client:$SOUNDWAVE_BUILD_VERSION" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
          )"

          test "$ACTUAL_VERSION" = "$SOUNDWAVE_BUILD_VERSION"
