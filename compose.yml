services:
  server:
    build:
      context: ./server
    env_file:
      - ./database/.env
      - ./server/.env
    environment:
      PORT: 8080
      PGHOST: host.docker.internal
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
    environment:
      VITE_PROXY_TARGET: http://server:8080
    ports:
      - "5173:5173"
    depends_on:
      - server
