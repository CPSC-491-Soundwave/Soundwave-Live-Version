server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    location /account/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}